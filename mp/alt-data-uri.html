<!-- Put this clean, simple HTML/JS layout on your website -->
<input type="file" id="media-uploader">
<video id="media-player" controls style="width: 100%; max-width: 600px; display: none;"></video>

<script>
  document.getElementById('media-uploader').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
      // Creates a temporary memory link directly to the local file
      const blobUrl = URL.createObjectURL(file);
      
      const player = document.getElementById('media-player');
      player.src = blobUrl;
      player.style.display = 'block'; // Instantly starts playing the 1 GB video
    }
  });
</script>
