<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Data URI Pipeline</title>
    <style>
        :root {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --accent-color: #007aff;
            --text-color: #ffffff;
            --text-muted: #aaaaaa;
            --success-color: #34c759;
            --error-color: #ff3b30;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 500px;
            text-align: center;
        }
        h2 { margin-top: 0; font-weight: 600; }
        p { color: var(--text-muted); font-size: 14px; margin-bottom: 25px; }
        
        /* GUI Drop Zone Custom Styles */
        .drop-zone {
            border: 2px dashed #444;
            border-radius: 12px;
            padding: 40px 20px;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 20px;
        }
        .drop-zone:hover, .drop-zone.drag-over {
            border-color: var(--accent-color);
            background-color: rgba(0, 122, 255, 0.05);
        }
        .drop-zone-text {
            font-size: 16px;
            color: var(--text-muted);
        }
        #file-input { display: none; }

        /* Status & Output Display */
        .status-box {
            font-size: 14px;
            margin: 15px 0;
            padding: 10px;
            border-radius: 8px;
            display: none;
        }
        .status-box.loading { background-color: rgba(0, 122, 255, 0.1); color: var(--accent-color); display: block; }
        .status-box.success { background-color: rgba(52, 199, 89, 0.1); color: var(--success-color); display: block; }
        .status-box.error { background-color: rgba(255, 59, 48, 0.1); color: var(--error-color); display: block; }

        .output-container {
            margin-top: 20px;
            text-align: left;
            display: none;
        }
        .output-container label {
            font-size: 12px;
            color: var(--text-muted);
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 5px;
        }
        textarea {
            width: 100%;
            height: 120px;
            background-color: #111;
            border: 1px solid #333;
            border-radius: 8px;
            color: #34c759;
            padding: 10px;
            font-family: monospace;
            font-size: 12px;
            resize: none;
            box-sizing: border-box;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Data URI API Converter</h2>
    <p>Select any file to automatically detect its type, structure a form upload payload, and retrieve your Data URI response.</p>

    <!-- GUI Target Element -->
    <div class="drop-zone" id="drop-zone">
        <span class="drop-zone-text" id="prompt-text">Tap to select or drop a file here</span>
        <input type="file" id="file-input">
    </div>

    <!-- Feedback UI States -->
    <div id="status" class="status-box"></div>

    <div class="output-container" id="output-box">
        <label>API Server Response (Data URI)</label>
        <textarea id="result-string" readonly placeholder="Awaiting string extraction..."></textarea>
    </div>
</div>

<script>
    const dropZone = document.getElementById('drop-zone');
    const fileInput = document.getElementById('file-input');
    const promptText = document.getElementById('prompt-text');
    const statusBox = document.getElementById('status');
    const outputBox = document.getElementById('output-box');
    const resultString = document.getElementById('result-string');

    // Replace this string with your production API address link
    const TARGET_API_URL = "https://your-api-endpoint.com";

    // Trigger file selection window natively upon GUI wrapper click
    dropZone.addEventListener('click', () => fileInput.click());

    // Drag-and-drop aesthetics hooks
    ['dragenter', 'dragover'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.add('drag-over'); }, false);
    });
    ['dragleave', 'drop'].forEach(eventName => {
        dropZone.addEventListener(eventName, (e) => { e.preventDefault(); dropZone.classList.remove('drag-over'); }, false);
    });

    // Ingest dropped files
    dropZone.addEventListener('drop', (e) => {
        const dt = e.dataTransfer;
        const files = dt.files;
        if (files.length) handleFileUploadPipeline(files[0]);
    });

    // Ingest clicked/selected files
    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) handleFileUploadPipeline(e.target.files[0]);
    });

    // Asynchronous Execution API Script
    async function handleFileUploadPipeline(file) {
        // UI reset behaviors
        promptText.innerText = `${file.name} (${(file.size / (1024 * 1024)).toFixed(2)} MB)`;
        updateStatus("Streaming file object payload to API...", "loading");
        outputBox.style.display = "none";

        // 1. FORM SETUP: Map file structure directly to your exact form key variable requirement
        const multipartForm = new FormData();
        multipartForm.append("convert", file, file.name);

        try {
            // 2. HTTP POST NETWORK CALL: No custom headers attached to prevent boundary breakages
            const apiRequest = await fetch(TARGET_API_URL, {
                method: "POST",
                body: multipartForm
            });

            if (!apiRequest.ok) {
                throw new Error(`Server returned error status: ${apiRequest.status}`);
            }

            // 3. CAPTURE RESPONSE payload directly into structural container elements
            const serverResponseText = await apiRequest.text();
            
            updateStatus("Data URI Generated Successfully!", "success");
            resultString.value = serverResponseText;
            outputBox.style.display = "block";

        } catch (error) {
            updateStatus(`Pipeline Fault: ${error.message}`, "error");
            console.error("API transmission failure details: ", error);
        }
    }

    function updateStatus(text, className) {
        statusBox.innerText = text;
        statusBox.className = `status-box ${className}`;
    }
</script>

</body>
</html>
